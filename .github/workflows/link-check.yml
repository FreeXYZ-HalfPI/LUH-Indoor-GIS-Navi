# Weekly check for dead links in the README, docs and app settings.
# Opens (or updates) one issue with the dead links. Nothing is changed in the repository.
name: Link check

on:
  schedule:
    - cron: "43 5 * * 1"   # Mondays, 05:43 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Dead links (automatic check)"
          rc=0
          python3 tools/check_links.py --report report.md || rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi
          [ -f report.md ] || { echo "no report written"; exit 1; }
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
