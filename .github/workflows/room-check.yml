# Weekly check: has LUH's public room list changed since the maps were built?
# Opens (or updates) one issue with the differences. Nothing is changed in the repository.
name: Room list check

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the Rauminfo room lists with the maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Room list changed (automatic check)"
          rc=0
          python3 tools/check_rooms.py --report report.md || rc=$?
          echo "check_rooms exit code: $rc"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          [ -f report.md ] || { echo "no report written"; exit 1; }
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
